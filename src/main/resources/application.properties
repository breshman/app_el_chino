# ==============================================================================
# CONFIGURACIÓN DEL SISTEMA DE MANTENIMIENTO - EMPRESA "EL CHINO" (LIMA, PERÚ)
# ==============================================================================
spring.application.name=el-chino-mantenimiento
server.port=8080
server.servlet.session.timeout=30m

# ==============================================================================
# CONEXIÓN A BASE DE DATOS POSTGRESQL (el_chino_mantenimiento)
# ==============================================================================
spring.datasource.url=jdbc:postgresql://localhost:5434/el_chino_mantenimiento
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool HikariCP optimizado para operaciones transaccionales de taller
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# Inicialización de scripts SQL (schema.sql y data.sql)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false

# ==============================================================================
# MOTOR DE PLANTILLAS THYMELEAF
# ==============================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ==============================================================================
# DOCUMENTACIÓN SWAGGER / OPENAPI 3
# ==============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# ==============================================================================
# LOGGING Y AUDITORÍA
# ==============================================================================
logging.level.root=INFO
logging.level.com.elchino.mantenimiento=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
