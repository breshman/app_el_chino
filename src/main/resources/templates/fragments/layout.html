<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' | El Chino Mantenimiento'">Sistema El Chino</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-chino shadow-sm mb-4 no-print">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">🚌 EL CHINO | Taller &amp; Flota</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/unidades}">Unidades</a></li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMINISTRADOR','RESPONSABLE_MANTENIMIENTO','TECNICO','OPERACIONES')">
                    <a class="nav-link" th:href="@{/inspecciones}">Inspecciones</a>
                </li>
                <li class="nav-item"><a class="nav-link" th:href="@{/fallas}">Fallas</a></li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMINISTRADOR','RESPONSABLE_MANTENIMIENTO','TECNICO','OPERACIONES')">
                    <a class="nav-link" th:href="@{/mantenimientos}">Programación</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMINISTRADOR','RESPONSABLE_MANTENIMIENTO','TECNICO')">
                    <a class="nav-link" th:href="@{/reparaciones}">Reparaciones</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMINISTRADOR','RESPONSABLE_MANTENIMIENTO','TECNICO')">
                    <a class="nav-link" th:href="@{/repuestos}">Repuestos</a>
                </li>
                <li class="nav-item"><a class="nav-link" th:href="@{/historial}">Historial</a></li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMINISTRADOR','RESPONSABLE_MANTENIMIENTO','OPERACIONES')">
                    <a class="nav-link" th:href="@{/reportes}">Reportes</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')">
                    <a class="nav-link" th:href="@{/usuarios}">Usuarios</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-warning fw-semibold" th:href="@{/swagger-ui.html}" target="_blank">Swagger API</a>
                </li>
            </ul>
            <div class="d-flex align-items-center text-white">
                <span class="me-3 small">
                    👤 <strong sec:authentication="name">usuario</strong>
                    <span class="badge bg-light text-dark ms-1" sec:authentication="principal.authorities">ROL</span>
                </span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-sm btn-outline-light">Salir</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div th:fragment="alertas" class="container-fluid">
    <div th:if="${exitoMensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${exitoMensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${alertaMensaje}" class="alert alert-warning alert-dismissible fade show" role="alert">
        <span th:text="${alertaMensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMensaje}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${param.error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<footer th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</footer>

</body>
</html>
